<h1 class="text-3xl font-montserrat font-bold">
  Todos los productos: <span class="text-accent">{{ gender() }}</span>
</h1>
<h2 class="text-lg mb-5">para todos los gustos</h2>
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 mt-3 gap-4 animate-fade-in">
  @for (product of productsResource.value()?.products ?? []; track $index) {
    <product-card [product]="product" />
  } @empty {
    <p>No hay productos!</p>
  }
</div>
<!--Pagination -->
<app-pagination
  [pages]="productsResource.value()?.pages ?? 0"
  [currentPage]="paginationService.currentPage()"
/>
